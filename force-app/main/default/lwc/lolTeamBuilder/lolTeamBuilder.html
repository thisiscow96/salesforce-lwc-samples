<template>
    <lightning-card title={cardTitle} icon-name="standard:team_member">
        <div slot="actions" class="actions">
            <lightning-button class="export-button" icon-name="utility:download" label="Excel 다운로드"
                onclick={handleExport} disabled={exportDisabled}></lightning-button>
            <template lwc:if={canAnalyze}>
                <lightning-button class="analyze-button" variant="brand" icon-name="utility:einstein" label={analyzeLabel}
                    onclick={handleAnalyze} disabled={analyzeDisabled}></lightning-button>
            </template>
        </div>

        <div class="slds-p-horizontal_medium">
            <template lwc:if={loadError}>
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">{loadError}</div>
            </template>
            <template lwc:if={teamGoal}>
                <p class="goal slds-text-color_weak slds-m-bottom_small">팀 목표: {teamGoal}</p>
            </template>

            <template lwc:if={isReady}>
                <lightning-layout multiple-rows>
                    <!-- Claude 분석: 분석 요청 버튼 바로 아래 (화면 맨 위) -->
                    <lightning-layout-item size="12" padding="around-small">
                        <div class="panel analysis">
                            <h2 class="panel-title">{analysisTitle}</h2>
                            <template lwc:if={analyzing}>
                                <div class="analyzing">
                                    <lightning-spinner alternative-text="분석 중" size="small"></lightning-spinner>
                                    <p class="slds-p-left_xx-large">최신 메타를 검색하며 분석 중입니다. 최대 2분 걸릴 수 있습니다.</p>
                                </div>
                            </template>
                            <template lwc:if={analysisError}>
                                <div class="analysis-error slds-notify slds-notify_alert slds-alert_error" role="alert">{analysisError}</div>
                            </template>
                            <template lwc:if={analysis}>
                                <p class="analysis-meta slds-text-color_weak">{analysisMeta}</p>
                                <div class="analysis-text">
                                    <template for:each={analysisSections} for:item="sec">
                                        <section key={sec.key} class="report-section">
                                            <template lwc:if={sec.title}>
                                                <h3 class="report-title">{sec.title}</h3>
                                            </template>
                                            <template for:each={sec.lines} for:item="ln">
                                                <p key={ln.key} class={ln.cls}>{ln.text}</p>
                                            </template>
                                            <template lwc:if={sec.hasGroups}>
                                                <div class="report-groups">
                                                    <template for:each={sec.groups} for:item="g">
                                                        <div key={g.key} class="report-group">
                                                            <h4 class="report-sub">{g.title}</h4>
                                                            <template for:each={g.lines} for:item="ln">
                                                                <p key={ln.key} class={ln.cls}>{ln.text}</p>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </section>
                                    </template>
                                </div>
                                <template lwc:if={hasSources}>
                                    <h3 class="slds-text-title_bold slds-m-top_small">출처</h3>
                                    <ol class="sources">
                                        <template for:each={analysisSources} for:item="src">
                                            <li key={src.key}><a href={src.url} target="_blank" rel="noopener noreferrer">{src.title}</a></li>
                                        </template>
                                    </ol>
                                </template>
                            </template>
                            <template lwc:if={showWaiting}>
                                <div class="waiting slds-box slds-theme_shade">
                                    <template lwc:if={isWaiting}>
                                        <lightning-spinner alternative-text="처리 대기" size="small"></lightning-spinner>
                                    </template>
                                    <p class="waiting-text">{waitingMessage}</p>
                                </div>
                            </template>
                            <template lwc:if={showGuestNote}>
                                <p class="guest-note slds-text-color_weak">{guestNoteText}</p>
                            </template>
                            <template lwc:if={showGuestInfo}>
                                <p class="guest-info slds-text-color_weak slds-m-bottom_x-small">공개 사이트 안내: 같은 조합은 최근 분석 결과를 함께 보여 주며, 새 분석 요청은 시간당 횟수가 제한됩니다. 분석에는 1~2분 정도 걸립니다.</p>
                            </template>
                            <template lwc:if={showAnalysisHint}>
                                <p class="slds-text-color_weak">조합을 정한 뒤 [{analyzeLabel}]을 누르면 롤 코치 관점의 리포트를 받습니다: 라인별 빌드·주의사항, 상대 조합별 대처법, 정글 동선, 오브젝트 셋업(90·60·30초 전, 우세·비등·열세와 맞교환), 한타 포지션, 사이드 운영, 시간대별 웨이브 배치, 밴·대체 픽. 통계는 lol.ps(프로관전러) 기준.</p>
                            </template>

                            <!-- Claude Code 모드: 내 최근 요청 (PC가 꺼져 있던 동안 처리된 결과 확인) -->
                            <template lwc:if={showRecent}>
                                <div class="recent slds-m-top_medium">
                                    <div class="panel-bar">
                                        <h3 class="slds-text-title_bold">내 최근 요청</h3>
                                        <lightning-button-icon class="refresh-recent" icon-name="utility:refresh" variant="bare"
                                            alternative-text="새로고침" title="새로고침" onclick={handleRefreshRecent}></lightning-button-icon>
                                    </div>
                                    <template lwc:if={hasRecent}>
                                        <ul class="recent-list">
                                            <template for:each={recentRows} for:item="r">
                                                <li key={r.id} class="recent-item">
                                                    <span class={r.statusClass}>{r.status}</span>
                                                    <span class="recent-name">{r.name}</span>
                                                    <span class="recent-comp">{r.composition}</span>
                                                    <span class="slds-text-color_weak">{r.created}</span>
                                                    <lightning-button class="open-request" variant="base" label="보기" data-id={r.id}
                                                        onclick={handleOpenRequest}></lightning-button>
                                                </li>
                                            </template>
                                        </ul>
                                    </template>
                                    <template lwc:else>
                                        <p class="slds-text-color_weak">아직 요청이 없습니다.</p>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </lightning-layout-item>

                    <!-- 1. 라인별 선택 -->
                    <lightning-layout-item size="12" large-device-size="7" padding="around-small">
                        <div class="panel">
                            <h2 class="panel-title">조합 입력</h2>
                            <template for:each={laneRows} for:item="row">
                                <div key={row.lane} class="lane-row">
                                    <div class="lane-label">{row.label}</div>
                                    <lightning-combobox class="pick" data-lane={row.lane} label="챔피언" variant="label-hidden"
                                        placeholder="챔피언 선택" options={row.options} value={row.value}
                                        onchange={handlePickChange}></lightning-combobox>
                                    <lightning-combobox class="tier" data-lane={row.lane} label="실력" variant="label-hidden"
                                        options={row.tierOptions} value={row.tier} onchange={handleTierChange}></lightning-combobox>
                                    <lightning-input class="lock" data-lane={row.lane} type="checkbox" label="고정"
                                        checked={row.locked} onchange={handleLockChange}></lightning-input>
                                    <div class="lane-info slds-text-color_weak">{row.info}</div>
                                </div>
                            </template>
                            <template lwc:if={duplicateChampion}>
                                <p class="slds-text-color_error slds-m-top_x-small">{duplicateChampion}이(가) 두 라인에 선택되었습니다.</p>
                            </template>
                        </div>
                    </lightning-layout-item>

                    <!-- 2. 점수 -->
                    <lightning-layout-item size="12" large-device-size="5" padding="around-small">
                        <div class="panel">
                            <h2 class="panel-title">조합 점수</h2>
                            <template lwc:if={hasResult}>
                                <div class="score-head">
                                    <span class="total">{total}</span><span class="slds-text-color_weak"> / 100</span>
                                    <span class={gradeClass}>{grade}</span>
                                </div>
                                <c-echart class="radar" option={radarOption} height="260px"></c-echart>
                            </template>
                        </div>
                    </lightning-layout-item>

                    <template lwc:if={hasResult}>
                        <!-- 2-1. 조합 예측 대시보드 (자체 모델 추정치) -->
                        <lightning-layout-item size="12" padding="around-small">
                            <div class="dash">
                                <div class="dash-head">
                                    <div>
                                        <h2 class="dash-title">조합 예측 대시보드</h2>
                                        <p class="dash-sub">평균 상대(모든 능력치 5) 기준 50%에서 출발하는 자체 모델 추정치입니다. 실제 경기 통계가 아니며, 하단 픽 통계만 Patch 26.20 실제 데이터입니다.</p>
                                    </div>
                                </div>
                                <div class="dash-kpis">
                                    <template for:each={predictionHighlights} for:item="k">
                                        <div key={k.key} class="kpi">
                                            <span class="kpi-label">{k.label}</span>
                                            <span class="kpi-value">{k.value}</span>
                                            <span class="kpi-sub">{k.sub}</span>
                                        </div>
                                    </template>
                                </div>
                                <div class="dash-card">
                                    <h3 class="dash-card-title">오브젝트·초반 이벤트 선점 확률</h3>
                                    <c-echart class="chart-gauge" option={predictionGauge} height="190px"></c-echart>
                                </div>
                                <div class="dash-grid">
                                    <div class="dash-card">
                                        <h3 class="dash-card-title">라인별 초반 킬 확률 (14분 이전)</h3>
                                        <c-echart class="chart-lanes" option={predictionLanes} height="210px"></c-echart>
                                    </div>
                                    <div class="dash-card">
                                        <h3 class="dash-card-title">시간대별 한타 우위</h3>
                                        <c-echart class="chart-timeline" option={predictionTimeline} height="210px"></c-echart>
                                    </div>
                                    <div class="dash-card">
                                        <h3 class="dash-card-title">딜 구성</h3>
                                        <c-echart class="chart-damage" option={predictionDamage} height="230px"></c-echart>
                                    </div>
                                    <div class="dash-card">
                                        <h3 class="dash-card-title">선택한 픽의 패치 통계 (Emerald+)</h3>
                                        <c-echart class="chart-picks" option={predictionPicks} height="230px"></c-echart>
                                    </div>
                                </div>
                            </div>
                        </lightning-layout-item>

                        <!-- 3. 항목별 근거 -->
                        <lightning-layout-item size="12" large-device-size="7" padding="around-small">
                            <div class="panel">
                                <h2 class="panel-title">항목별 점수와 근거</h2>
                                <template for:each={categories} for:item="c">
                                    <div key={c.key} class="category" title={c.description}>
                                        <div class="category-head">
                                            <span>{c.label}</span>
                                            <span class="category-points">{c.points} / {c.max}</span>
                                        </div>
                                        <div class="bar"><div class="bar-fill" style={c.barStyle}></div></div>
                                        <div class="category-detail slds-text-color_weak">{c.detail}</div>
                                    </div>
                                </template>
                            </div>
                        </lightning-layout-item>

                        <!-- 4. 왜 좋은가 / 약점 / 교체 -->
                        <lightning-layout-item size="12" large-device-size="5" padding="around-small">
                            <div class="panel">
                                <h2 class="panel-title">이 조합이 좋은 이유</h2>
                                <ul class="reasons strengths">
                                    <template for:each={strengths} for:item="s">
                                        <li key={s.key}>{s.text}</li>
                                    </template>
                                </ul>
                                <h2 class="panel-title slds-m-top_small">약점·주의</h2>
                                <template lwc:if={hasWeaknesses}>
                                    <ul class="reasons weaknesses">
                                        <template for:each={weaknesses} for:item="w">
                                            <li key={w.key}>{w.text}</li>
                                        </template>
                                    </ul>
                                </template>
                                <template lwc:else>
                                    <p class="slds-text-color_weak">두드러진 약점 없음</p>
                                </template>
                                <h2 class="panel-title slds-m-top_small">운영 플랜</h2>
                                <p class="plan">{plan}</p>
                                <h2 class="panel-title slds-m-top_small">점수를 올리는 교체</h2>
                                <template lwc:if={hasSwaps}>
                                    <template for:each={swapItems} for:item="x">
                                        <div key={x.key} class="swap">
                                            <span>{x.text} <b class="slds-text-color_success">{x.delta}</b></span>
                                            <lightning-button variant="base" label="적용" data-lane={x.lane} data-id={x.id}
                                                onclick={handleSwap}></lightning-button>
                                        </div>
                                    </template>
                                </template>
                                <template lwc:else>
                                    <p class="slds-text-color_weak">후보 풀 안에서 더 높은 단일 교체 없음</p>
                                </template>
                            </div>
                        </lightning-layout-item>
                    </template>

                    <!-- 6. 조합표 -->
                    <lightning-layout-item size="12" padding="around-small">
                        <div class="panel">
                            <div class="panel-bar">
                                <h2 class="panel-title">추천 조합표 <span class="search-summary slds-text-color_weak">{searchSummary}</span></h2>
                                <div class="panel-bar-actions">
                                    <lightning-input class="structure-toggle" type="toggle" label="1탱+1브루저만" message-toggle-active=""
                                        message-toggle-inactive="" checked={requireStructure} onchange={handleStructureToggle}></lightning-input>
                                    <lightning-input class="pool-mode-toggle" type="toggle" label="선호 외 상위 픽 포함" message-toggle-active=""
                                        message-toggle-inactive="" checked={isExtendedPool} onchange={handlePoolModeToggle}
                                        field-level-help="끄면 팀 선호 픽(★) 안에서, 켜면 라인별 메타 상위 8명 + 선호 픽 상위 4명까지 탐색"></lightning-input>
                                    <lightning-button class="search-button" icon-name="utility:search" label="최적 조합 찾기 (고정 라인 유지)"
                                        onclick={handleSearch}></lightning-button>
                                    <lightning-button class="apply-best-button" label="1위 적용" onclick={handleApplyBest}></lightning-button>
                                </div>
                            </div>
                            <div class="table">
                                <lightning-datatable class="combo-table" key-field="id" data={comboRows} columns={comboColumns}
                                    hide-checkbox-column onrowaction={handleComboAction}></lightning-datatable>
                            </div>
                        </div>
                    </lightning-layout-item>

                    <!-- 7. 라인별 픽 풀 -->
                    <lightning-layout-item size="12" padding="around-small">
                        <div class="panel">
                            <div class="panel-bar">
                                <h2 class="panel-title">라인별 전체 픽 (Patch 26.20 통계) <span class="slds-text-color_weak">★ 팀 선호 · 이 자리 점수 = 현재 조합에서 그 라인만 바꿨을 때 총점</span></h2>
                                <lightning-input class="pool-filter-toggle" type="toggle" label="선호 픽만" message-toggle-active=""
                                    message-toggle-inactive="" checked={poolPreferredOnly} onchange={handlePoolFilterToggle}></lightning-input>
                            </div>
                            <lightning-tabset>
                                <template for:each={poolTabs} for:item="tab">
                                    <lightning-tab key={tab.lane} label={tab.label}>
                                        <div class="pool-scroll">
                                        <lightning-datatable class="pool-table" key-field="id" data={tab.rows} columns={poolColumns}
                                            hide-checkbox-column sorted-by={poolSortBy} sorted-direction={poolSortDirection}
                                            default-sort-direction="desc" onsort={handlePoolSort}></lightning-datatable>
                                        </div>
                                    </lightning-tab>
                                </template>
                            </lightning-tabset>
                            <!-- 점수 기준과 지표 출처 -->
                            <div class="basis slds-m-top_small">
                                <h3 class="basis-title">점수는 어떻게 계산하나요?</h3>
                                <ul class="basis-list">
                                    <li><b>이 자리 점수</b> = 현재 조합에서 그 라인만 바꿨을 때의 <b>팀 조합 총점(100점)</b>입니다. 챔피언 개인 성능 순위가 아닙니다.
                                        배점: 메타 강도 10 · 후반 캐리력 15 · CC(탑·정글 중심) 15 · 앞라인 구조 15 · AD/AP 밸런스 10 · 이니시·보호 10 · 시너지 15 · 실력 적합도 10.</li>
                                    <li>팀 목표(탑·정글 <b>1탱 + 1브루저</b>, 탑·정글이 CC·앞라인 담당, 후반 지향)를 반영합니다. 그래서 정글이 브루저(예: 오공)일 때 탑 브루저를 넣으면 2브루저가 되어
                                        앞라인 구조(15점)와 CC(15점)에서 깎이고, 개인 성능이 좋아도 이 자리 점수는 낮게 나옵니다. 정글을 탱커로 바꾸면 탑 브루저 점수가 올라갑니다.</li>
                                    <li><b>PS 점수</b>는 개인 성능 지표입니다(lol.ps: 승률·픽률·밴률 종합). 솔로랭크에서 그 챔피언 자체가 얼마나 센지는 PS 점수·티어·꿀챔(🍯)으로 보세요.</li>
                                    <li>배점과 팀 목표는 Setup › Custom Metadata Types › LoL Score Weight / LoL AI Setting에서 바꿀 수 있습니다.</li>
                                </ul>
                                <h3 class="basis-title slds-m-top_x-small">지표 출처</h3>
                                <ul class="basis-list sources-list">
                                    <li>티어 · 승률 · 픽률 · 밴률 · PS 점수 · 꿀챔:
                                        <a href="https://lol.ps/statistics?tier=2&amp;region=0" target="_blank" rel="noopener noreferrer">lol.ps (프로관전러 P.S)</a> 한국 서버 · 에메랄드+ · Patch 26.20 (1순위).
                                        lol.ps에 없는 라인 항목만 <a href="https://www.mobatrainer.com/lol/tier-list" target="_blank" rel="noopener noreferrer">MOBA Trainer</a>(Emerald+, u.gg·op.gg 병합)로 보충 — 행마다 출처는 Excel 픽 풀 시트의 "통계 출처" 열에 기록</li>
                                    <li>챔피언 이름 · 스킬 정보: <a href="https://ddragon.leagueoflegends.com/cdn/16.20.1/data/ko_KR/champion.json" target="_blank" rel="noopener noreferrer">Riot Data Dragon 16.20.1 (ko_KR)</a></li>
                                    <li>능력치(CC · 앞라인 · 딜 · 초반 · 후반 · 이니시 · 보호 · 캐리 · 난이도 · 솔킬 · 주도권 · 오브젝트, 0~10): 공식 통계가 아니라 스킬 구성 기준으로 직접 매긴 <b>정성 평가</b>입니다.
                                        수정: Setup › Custom Metadata Types › LoL Champion</li>
                                    <li>시너지 점수: 챔피언 쌍별 스킬 연계 기준 정성 평가 (LoL Synergy)</li>
                                    <li>조합 예측 대시보드: 위 능력치로 계산한 자체 모델 추정치 (평균 상대 기준 50%)</li>
                                </ul>
                            </div>
                        </div>
                    </lightning-layout-item>
                </lightning-layout>
            </template>
            <template lwc:elseif={noData}>
                <lightning-spinner alternative-text="불러오는 중" size="medium"></lightning-spinner>
            </template>
        </div>
    </lightning-card>
</template>
