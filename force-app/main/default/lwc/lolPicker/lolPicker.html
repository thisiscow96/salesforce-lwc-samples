<template>
    <div class={rootClass} onfocusout={handleFocusOut}>
        <button type="button" class="trigger" aria-haspopup="listbox" aria-expanded={ariaExpanded} aria-label={label}
            onclick={handleToggle} onkeydown={handleTriggerKeydown}>
            <template lwc:if={selected}>
                <template lwc:if={selected.icon}>
                    <img class="icon" src={selected.icon} alt="" loading="lazy" />
                </template>
                <span class="name">{selected.name}</span>
                <template lwc:if={selected.preferred}>
                    <span class="star" title="팀 선호 픽">★</span>
                </template>
                <template lwc:if={selected.badge}>
                    <span class={selectedBadgeClass}>{selected.badge}</span>
                </template>
            </template>
            <template lwc:else>
                <span class="placeholder">{placeholder}</span>
            </template>
            <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </button>

        <template lwc:if={isOpen}>
            <div class="menu" onmousedown={handleMenuMousedown}>
                <template lwc:if={searchable}>
                    <div class="search">
                        <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
                            <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.25"></circle>
                            <path d="M10.5 10.5L14 14" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"></path>
                        </svg>
                        <input class="search-input" type="text" placeholder="챔피언 검색" value={query} aria-label="검색"
                            oninput={handleSearch} onkeydown={handleListKeydown} />
                    </div>
                </template>
                <ul class="list" role="listbox" tabindex="-1" aria-label={label} onkeydown={handleListKeydown}>
                    <template for:each={rows} for:item="r">
                        <li key={r.key} class={r.cls} role="option" aria-selected={r.ariaSelected} data-value={r.value}
                            data-index={r.index} onclick={handleOptionClick} onmousemove={handleOptionHover}>
                            <template lwc:if={r.icon}>
                                <img class="icon" src={r.icon} alt="" loading="lazy" />
                            </template>
                            <span class="option-main">
                                <span class="option-name">{r.name}<template lwc:if={r.preferred}><span class="star" title="팀 선호 픽">★</span></template></span>
                                <template lwc:if={r.hasChips}>
                                    <span class="option-chips">
                                        <template for:each={r.chipItems} for:item="c">
                                            <span key={c.key} class="chip">{c.text}</span>
                                        </template>
                                    </span>
                                </template>
                            </span>
                            <template lwc:if={r.stat}>
                                <span class="option-stat"><span class="option-stat-label">{r.stat.label}</span>{r.stat.value}</span>
                            </template>
                            <template lwc:if={r.badge}>
                                <span class={r.badgeClass}>{r.badge}</span>
                            </template>
                        </li>
                    </template>
                    <template lwc:if={isEmpty}>
                        <li class="empty" role="presentation">검색 결과가 없습니다</li>
                    </template>
                </ul>
            </div>
        </template>
    </div>
</template>
