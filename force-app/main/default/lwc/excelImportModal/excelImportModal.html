<template>
    <lightning-modal-header label={headerLabel}></lightning-modal-header>
    <lightning-modal-body>
        <c-excel-import config-name={configName} record-id={recordId} onconfigload={handleConfigLoad}
            onbusychange={handleBusyChange} onimportcomplete={handleImportComplete}></c-excel-import>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="닫기" onclick={handleClose} disabled={disableClose}></lightning-button>
    </lightning-modal-footer>
</template>
